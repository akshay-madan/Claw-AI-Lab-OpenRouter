# ════════════════════════════════════════════════════════════════════
#  Claw AI Lab — configuration
#  • Models: pick a preset below.   • Pipeline: settings further down.
#  • API keys: NOT here — in the file named by secrets_file
#  • This machine only (secrets_file, python_path): config.local.yaml, which git ignores
#  • __PLACEHOLDERS__ are filled in per project by the app; leave them.
#  Changes apply to NEW projects after: ./lab.sh restart-app
# ════════════════════════════════════════════════════════════════════

# ── API keys ─────────────────────────────────────────────────────────
# Path to the file holding your keys (read by lab.sh; ~ is allowed). Two formats work:
#   • KEY=value lines: RESEARCHCLAW_API_KEY=..., RESEARCHCLAW_IMAGE_API_KEY=..., EXA_API_KEY=..., TAVILY_API_KEY=...
#   • just the OpenRouter key on its own line
# The $CLAW_SECRETS_FILE environment variable overrides this.
secrets_file: "~/.config/claw-ai-lab/secrets.env"   # set yours in config.local.yaml
# OpenRouter IDs (https://openrouter.ai/models). Prices: USD per 1M tokens, input / output (Oct 2026).
# Override once at launch: ./lab.sh restart-app quality   (launch arg > $MODEL_PROFILE > this line)
model_profile: eco        # eco | quality | custom | original

model_profiles:
  # Cheap runs for testing and exploration.
  eco:
    primary_model: "openai/gpt-5.6-luna"           # $0.20 / $1.20   fast; DeepSeek V4 Pro was slow and billed ~5x its list price
    coding_model: "google/gemini-3.8-flash"        # $0.75 / $3.75   best coding per $ among cheap models
    reasoning_effort: low                          # less thinking: faster, cheaper (low | medium | high)
    image_model: "google/gemini-3.1-flash-image"   # $0.50 / $3      Nano Banana 2, near-Pro quality
    fallback_models:
      - "qwen/qwen3.5-plus-20260420"               # $0.30 / $1.80
      - "google/gemini-3.8-flash"                  # $0.75 / $3.75
    discussion_models:                             # differ from the main model, for other viewpoints
      - "qwen/qwen3.5-plus-20260420"               # $0.30 / $1.80
      - "google/gemini-3.8-flash"                  # $0.75 / $3.75

  # Best results. Roughly 10-20x the cost of eco.
  quality:
    primary_model: "openai/gpt-5.6-sol"            # $2 / $10   flagship reasoning, research & writing
    coding_model: "anthropic/claude-opus-5.5"      # $4 / $20   strongest multi-step coding → fewer fix loops
    image_model: "google/gemini-3-pro-image"       # $2 / $12   Nano Banana Pro, best figures
    fallback_models:                               # different vendors, so one outage doesn't stall a run
      - "anthropic/claude-sonnet-5.5"              # $2 / $10
      - "google/gemini-3.8-flash"                  # $0.75 / $3.75
    discussion_models:                             # 2 vendors ≠ primary → genuinely different viewpoints
      - "anthropic/claude-sonnet-5.5"              # $2 / $10
      - "google/gemini-3.1-pro-preview"            # $2 / $12

  # Your own mix — edit freely. Starts as the README's original defaults.
  custom:
    primary_model: "openai/gpt-5.4"                # $2.50 / $15
    coding_model: "openai/gpt-5.4"                 # $2.50 / $15
    image_model: "google/gemini-3-pro-image"       # $2 / $12
    fallback_models:
      - "qwen/qwen3.5-plus-20260420"               # $0.30 / $1.80
      - "qwen/qwen-plus"                           # $0.26 / $0.78
    discussion_models:
      - "anthropic/claude-sonnet-4.6"              # $3 / $15
      - "qwen/qwen3.5-plus-20260420"               # $0.30 / $1.80

  # The authors' setup, as in their examples/config_template.yaml (not OpenRouter).
  # A preset may also set provider / base_url. Put your own endpoint in base_url,
  # and that provider's key in secrets_file (RESEARCHCLAW_API_KEY) or llm.api_key.
  original:
    provider: "openai-compatible"
    base_url: "your-api-endpoint"                  # e.g. https://api.vectorengine.ai/ or http://www.longcatcloud.com/
    primary_model: "gpt-5.4"
    coding_model: "gpt-5.4"
    image_model: "gemini-3-pro-image-preview"
    fallback_models:
      - "qwen3.5-plus"
      - "qwen-plus"
    discussion_models:
      - "claude-sonnet-4-6"
      - "qwen3.5-plus"

# ── Spending limit ───────────────────────────────────────────────────
# USD. Agents stop at 85% of this (OpenRouter reports spend a little late); 0 = no limit.
# Counts from when it is first used; delete backend/runs/spend.json to start counting again.
# OpenRouter only: with another provider and a limit set, nothing runs.
spend_limit_usd: 2

# ── Agents per layer ─────────────────────────────────────────────────
# Agents each layer starts with. One agent takes one project and runs all of
# that layer's stages for it, so N agents = up to N projects in that layer at once.
# You can also add/remove agents live with the + / − buttons in the UI (not saved).
agent_pool:
  idea: 3          # L1 research & ideas (S1–S8)
  experiment: 2    # L2 experiment design (S9)
  coding: 3        # L3 code & resources (S10–S13)
  execution: 4     # L4 execution & refinement (S14–S18), also limited by free GPUs
  writing: 2       # L5 paper writing (S19–S22)

# ── Layers switched off ──────────────────────────────────────────────
# Layers listed here start switched off: new projects skip all of that layer's
# stages and pass straight to the next layer's queue. Projects submitted earlier
# are not affected. Flip a layer live with the switch on its header in the UI
# (not saved). Names: idea | experiment | coding | execution | writing, or L1–L5.
# Later stages read files the skipped ones would have written; supply them when
# submitting (Pipeline stages → Start at) or they get empty text.
disabled_layers: []   # e.g. [idea, experiment] to start every project at L3

# ── Pipeline ─────────────────────────────────────────────────────────
project:
  name: "__PROJECT_ID__"
  mode: "full-auto"

research:
  topic: "__TOPIC__"
  domains:
    - "deep-learning"
  daily_paper_count: 5
  quality_threshold: 3.0
  reference_papers: __REFERENCE_PAPERS__

notifications:
  channel: "console"
  on_stage_start: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_message: false
  use_memory: false
  use_web_fetch: false

llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"   # OpenRouter
  api_key: ""   # Leave empty: OpenRouter key comes from secrets_file (RESEARCHCLAW_API_KEY)
  api_key_env: "RESEARCHCLAW_API_KEY"
  # Models come from the active preset above (model_profile).
  image_base_url: ""   # Optional: separate API endpoint for image generation; falls back to base_url if empty
  image_api_key: ""    # Leave empty: set RESEARCHCLAW_IMAGE_API_KEY in secrets_file (falls back to main key)

security:
  hitl_required_stages: []

experiment:
  mode: "sandbox"
  time_budget_sec: 2400
  max_iterations: 3
  metric_key: "primary_metric"
  metric_direction: "minimize"
  datasets_dir: ""
  checkpoints_dir: ""
  codebases_dir: ""
  shared_results_dir: "runs/shared_results"
  paper_length: "long"
  auto_install_torch: false   # true = S1 installs PyTorch by itself when it finds a GPU (authors' default)
  sandbox:
    python_path: ""   # set yours in config.local.yaml
  sanity_check_max_iterations: 100

runtime:
  timezone: "Asia/Shanghai"

web_search:
  enabled: true
  # exa_api_key_env: "EXA_API_KEY"    # Exa AI search (https://exa.ai)
  # exa_search_type: "auto"            # auto | neural | fast
  # tavily_api_key_env: "TAVILY_API_KEY"

prompts:
  custom_file: ""
